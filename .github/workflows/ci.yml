name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check publication scope
        run: python scripts/check_publication.py
      - name: Classroom tests (3 before learner changes)
        run: python scripts/ci.py test
      - name: Product tests and branch coverage
        run: python scripts/ci.py test --suite product --reports reports/product
      - name: Flake8
        run: python -m flake8 doorlock tests vehicle_access product_tests scripts
      - name: Lizard gate
        run: python -m lizard doorlock vehicle_access scripts -C 10
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/

